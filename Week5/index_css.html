<!-- CSS: cascading style sheets
 -> css rules apply from generic to specific html elemments
 html > body > section > p > b

 -> css rile to the b
Types of CSS:
    1. Inline css -> adding css as an attribute to an html 
        element
    
    2. internal (embedded css)
        -> add all css rules inside a <style> element
            and put that in the head
        -> when you want to change something
            on a single page 
        
    3. external css
        -> create a stand alone css file and add it
        using <link> element put that in the head
        <link href="style_file.css" rel="stylesheet">
        -> when you have more than one page
        
        parts of css:
            . selector: what we use to identify the html element 
            . declaration: the actual rule, property followed by
            the value and a ;
            .  declaration block: all the rules for a single selector
    Tips:
    - use class for styling 
    - use id for unique hooks 

    Display property
            -> block - elements take up the full width, start on a new line
            -> inline - elements take as little space as possible
                and sit in line with other in line elements
            -> flex - turns the element into a flexbox
                - behaves like a block on the outside 


-->
