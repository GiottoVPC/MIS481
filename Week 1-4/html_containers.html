<!--
Container -> any element that can contain other elements 
All but void elements are containers
two types of containers:
    1. Block Container - takes entire width of available space
        - can include other block, inline elements
        - example -> <div><p><section><article>
    2. inline container -> takes just enough space to fit its content
        - Can only contain other inline elements and text
        - <a><b><em><i><span><label>

    the block vs inline is the default behavior it can be chnaged using CSS
-->
