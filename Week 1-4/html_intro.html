element: an html obj that has an opening tag and a closing tag
<opening_tag> some content </opening_tag>
elements can have attributes -> 
    a. modifier of element behavior (eg = type)
    b. as just an indentifier (eg = class, id)

<opening tag attribute="value">


html is not case sensitive
it is not identation sensitive 
1. <p> element -> creates a paragraph
2. <strong>, <b> -> makes text bold faced
3. whitespaces -> any sequence of whitespaces is treated as one.
4. <br> adds a linebreak -> void element does not have a closing tag and no content 
5. <i>, <em>, <cite>, -> creates italized text   
6. <mark>
7. <u>
8. lists -> unordered: <ul>
-->
